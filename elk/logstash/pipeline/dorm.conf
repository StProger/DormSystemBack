input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Parse ISO8601 timestamp from the application
  if [asctime] {
    date {
      match => ["asctime", "ISO8601"]
      target => "@timestamp"
      remove_field => ["asctime"]
    }
  }

  # Tag audit events
  if [logger_name] and [logger_name] =~ /^dorm\.audit/ {
    mutate { add_tag => ["audit"] }
  }

  # Tag HTTP events
  if [logger_name] and [logger_name] =~ /^dorm\.http/ {
    mutate { add_tag => ["http"] }
  }

  # Copy event field to event_type to avoid collision with ECS
  if [event] {
    mutate {
      copy => { "event" => "event_type" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "dorm-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
